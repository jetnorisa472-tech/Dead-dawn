x.save();x.globalCompositeOperation='lighter';for(let i=0;i<16;i++){const ex=((i*83+Math.sin(G.t*.4+i)*24)%W+W)%W,ey=((H-((i*53+G.t*20)%(H+20))));x.fillStyle=`rgba(255,${140+(i*23)%80|0},60,${(.12+.1*Math.sin(G.t*2+i))})`;x.fillRect(ex|0,ey|0,2,2)}x.restore();
{const vg=x.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=vg;x.fillRect(0,0,W,H)}
if(G.fl&&G.fl.t>0){x.save();x.globalAlpha=Math.min(.5,G.fl.t*1.6);x.fillStyle=G.fl.c;x.fillRect(0,0,W,H);x.restore()}}
function bar(t,l){return `<div style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;justify-content:center">${['Items','Weapons','Armor','Powers','Skills','Stats','Map'].map(n=>`<button class="b s" style="min-width:0;${n==t?'background:#b3261e':''}" onclick="inv('${n}')">${n}</button>`).join('')}</div>`}
const cs=c=>Object.entries(c).map(([k,v])=>`${N[k]} ${P.inv[k]}/${v}`).join(', ')||'Free';
const can=c=>Object.entries(c).every(([k,v])=>P.inv[k]>=v);
function inv(t){let h=`<h2 style="color:#ffd54a">INVENTORY</h2>`+bar(t);
if(t=='Items')h+=Object.keys(N).map(k=>`<div class="row"><span><img src="${IC[k].toDataURL()}"> ${N[k]}</span><b>x${P.inv[k]}</b></div>`).join('')+`<button class="b s" onclick="heal();inv('Items')">USE MEDKIT (+45)</button><button class="b s" ${P.inv.scrap>=2&&P.inv.bone>=1?'':'disabled'} onclick="P.inv.scrap-=2;P.inv.bone--;P.inv.ammo+=8;sv();inv('Items')">CRAFT 8 AMMO (2 Scrap, 1 Bone)</button>`;
if(t=='Weapons')h+=WP.map((w,i)=>{const L=P.wl[i],dm=w.d*(1+L*.15);return `<div class="row"><span><img src="${WI[i]}" style="width:14px;height:28px"> ${w.n}${L?' +'+L:''}${w.rg?' (GUN)':''}<br><small>DMG ${Math.round(dm)} | ${P.ow[i]?(L<5?'UP: '+cs(uc(i)):'MAX'):cs(w.c)}</small>${statBar(dm/maxWD*100,w.col)}</span>${P.ow[i]?`<span style="display:flex;flex-direction:column"><button class="b s" ${P.wep==i?'disabled':''} onclick="P.wep=${i};sv();inv('Weapons')">${P.wep==i?'EQUIPPED':'EQUIP'}</button>${L<5?`<button class="b s" ${can(uc(i))?'':'disabled'} onclick="upg(${i})">UPGRADE</button>`:''}</span>`:`<button class="b s" ${can(w.c)?'':'disabled'} onclick="mk('ow',WP,${i},'Weapons')">CRAFT</button>`}</div>`}).join('');
if(t=='Armor')h+=AR.map((a,i)=>`<div class="row"><span><img src="${HS[i].toDataURL()}" style="width:24px;height:28px"> ${a.n}<br><small>DEF ${a.f} | ${cs(a.c)}</small>${statBar(a.f/maxAF*100,a.col)}</span>${P.ar[i]?`<button class="b s" ${P.arm==i?'disabled':''} onclick="P.arm=${i};inv('Armor')">${P.arm==i?'WORN':'WEAR'}</button>`:`<button class="b s" ${can(a.c)?'':'disabled'} onclick="mk('ar',AR,${i},'Armor')">CRAFT</button>`}</div>`).join('');
if(t=='Powers')h+=PW.map((p,i)=>{const L=P.pl[i],c=3*(L+1),u=P.lv>=p[2];return `<div class="row ${u?'done':''}"><span><img src="${p[4]}" style="width:14px;height:14px;image-rendering:pixelated;vertical-align:middle"> ${p[0]}${L?' +'+L:''}<br><small>${u?'Key '+(i+1)+' - '+p[5]:'Unlocks at LV '+p[2]}</small></span>${u&&L<3?`<button class="b s" ${P.inv.gel>=c?'':'disabled'} onclick="pup(${i})">UP ${c} Gel</button>`:'<small>'+(p[3]*(1-.12*L)).toFixed(1)+'s</small>'}</div>`}).join('');
if(t=='Skills'){const SN=['Speed (+4% move/pt)','Crit Chance (+3%/pt)','Pickup Range (+10/pt)','Vitality (+8 HP/pt)'];h+=`<p style="color:#ffd54a">Skill Points: ${P.skp}${P.pr?' | Prestige '+P.pr:''}</p>`+SN.map((n,i)=>`<div class="row"><span>${n}<br><small>Level ${P.sk[i]}</small></span><button class="b s" ${P.skp>0?'':'disabled'} onclick="P.sk[${i}]++;P.skp--;${i==3?'P.mx+=8;P.hp+=8;':''}sv();inv('Skills')">+1</button></div>`).join('')}
if(t=='Stats'){h+=`<div class="row"><span>Total Kills</span><b>${P.tot}</b></div><div class="row"><span>Level</span><b>${P.lv}</b></div><div class="row"><span>Prestige</span><b>${P.pr||0}</b></div><div class="row"><span>Session Time</span><b>${Math.floor(G.t/60)}m ${Math.floor(G.t%60)}s</b></div><div class="row"><span>Achievements</span><b>${Object.keys(P.ach||{}).length}/${ACV.length}</b></div>`+ACV.map(([n],i)=>`<div class="row ${P.ach&&P.ach[i]?'done':''}"><span>${n}</span><b><img src="${P.ach&&P.ach[i]?II.check:II.lock}" style="width:12px;height:12px;image-rendering:pixelated"></b></div>`).join('')}
if(t=='Map')h+=M.map((m,i)=>`<div class="row ${i<P.mu?'done':''}"><span>${i+1}. ${TR[i][0]}<br><small>${QN[i]} ${Array.from({length:3},(_,j)=>`<img src="${j<P.ql[i]?II.starOn:II.starOff}" style="width:8px;height:8px;image-rendering:pixelated">`).join('')}</small></span>${i<=P.mu&&!G.free?`<button class="b s" onclick="go(${i})">${i==G.m?'HERE':'GO'}</button>`:`<small><img src="${II.lock}" style="width:10px;height:10px;image-rendering:pixelated"></small>`}</div>`).join('');
$('inv').innerHTML=h+`<button class="b" onclick="$('inv').classList.remove('on')">CLOSE</button>`}
const uc=i=>({scrap:5*(P.wl[i]+1),bone:2*(P.wl[i]+1)});
function upg(i){const c=uc(i);if(!can(c))return;Object.entries(c).forEach(([k,v])=>P.inv[k]-=v);P.wl[i]++;bp(800,.15);sv();inv('Weapons')}
function mk(a,L,i,t){const o=L[i];Object.entries(o.c).forEach(([k,v])=>P.inv[k]-=v);P[a][i]=1;P[a=='ow'?'wep':'arm']=i;bp(600,.15);sv();inv(t)}
const openInv=()=>{$('inv').classList.add('on');inv('Items')};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='j'||k=='enter')atk=1;if(k==' ')dash();if(k>='1'&&k<='6'&&k.length==1&&G.play)pw(k-1);if(k=='h')heal();if(k=='p'||k=='escape')pz();if(k=='i'||k=='tab'){e.preventDefault();$('inv').classList.contains('on')?$('inv').classList.remove('on'):G.play&&!$('ov').classList.contains('on')&&openInv()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=0;if(k=='j'||k=='enter')atk=0});
const js=$('js'),kn=$('kn');let jid=null;
function jm(e){const r=js.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;if(rot)[dx,dy]=[dy,-dx];let m=Math.hypot(dx,dy);if(m>R){dx=dx/m*R;dy=dy/m*R}jx=dx/R;jy=dy/R;kn.style.transform=`translate(${dx}px,${dy}px)`}
js.onpointerdown=e=>{jid=e.pointerId;js.setPointerCapture(jid);jm(e)};js.onpointermove=e=>{if(e.pointerId==jid)jm(e)};js.onpointerup=js.onpointercancel=()=>{jid=null;jx=jy=0;kn.style.transform=''};
$('ba').onpointerdown=()=>atk=1;$('ba').onpointerup=$('ba').onpointerleave=()=>atk=0;$('bd').onpointerdown=dash;$('bh').onpointerdown=heal;
function loop(t){const dt=Math.min(.05,(t-tm)/1000||0);tm=t;up(dt);if(!P)G.t+=dt;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);menuInit();
</script></body></html>
